<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz: Lógica com JavaScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-3 text-primary">Quiz: Introdução à Lógica com JavaScript</h1>
    <p class="lead">Responda as 20 questões sobre variáveis, tipos e operadores. Veja a explicação de cada resposta e, no final, confira seu desempenho.</p>
    
    <div id="quiz"></div>
    <button class="btn btn-success mt-3" onclick="finalizarQuiz()">Finalizar Quiz</button>
    <div id="final-result" class="mt-4"></div>
  </div>

  <script>
    const questions = [
      { text: "O que é uma variável em JavaScript?", options: ["Um valor fixo","Um espaço nomeado na memória","Um comentário","Um operador lógico"], answer: 1, explanation: "Variáveis armazenam valores na memória." },
      { text: "Qual palavra-chave declara variável reatribuível com escopo de bloco?", options: ["var","let","const","function"], answer: 1, explanation: "'let' cria variáveis com escopo de bloco." },
      { text: "O que acontece ao reatribuir const?", options: ["Permite se primitivo","TypeError","Vira let","Ignora"], answer: 1, explanation: "Constantes não podem ser reatribuídas." },
      { text: "typeof null retorna?", options: ["null","undefined","object","boolean"], answer: 2, explanation: "Por legado, retorna 'object'." },
      { text: "typeof NaN retorna?", options: ["NaN","number","undefined","object"], answer: 1, explanation: "NaN é do tipo number." },
      { text: `"5" + 2 resulta em?`, options: ["7","52","3","Erro"], answer: 1, explanation: "Concatena strings." },
      { text: `"5" - 2 resulta em?`, options: ["3","52","'3'","NaN"], answer: 0, explanation: "Coerção numérica." },
      { text: "Operador que compara valor e tipo?", options: ["==","=","===","!="], answer: 2, explanation: "=== compara valor e tipo." },
      { text: "Operador de soma e atribuição?", options: ["++","+=","=+","+:"], answer: 1, explanation: "x += y equivale a x = x + y." },
      { text: "1 + true resulta em?", options: ["2","1true","NaN","'2'"], answer: 0, explanation: "true vira 1." },
      { text: "Operador lógico E?", options: ["||","&&","!","??"], answer: 1, explanation: "&& retorna verdadeiro se ambos forem verdadeiros." },
      { text: "O que faz ! ?", options: ["Compara","Nega valor","Cria variável","Concatena"], answer: 1, explanation: "Inverte o booleano." },
      { text: "Valor padrão de let sem inicializar?", options: ["null","0","undefined","''"], answer: 2, explanation: "undefined." },
      { text: "typeof [] retorna?", options: ["array","object","list","function"], answer: 1, explanation: "Arrays são objetos." },
      { text: "Qual comparação é verdadeira?", options: ["NaN===NaN","0===false","null==undefined","'2'===2"], answer: 2, explanation: "null == undefined é true." },
      { text: "Operador que incrementa em 1?", options: ["++","+=","--","-="], answer: 0, explanation: "++ incrementa em 1." },
      { text: "'10' * 2 resulta em?", options: ["20","102","NaN","'20'"], answer: 0, explanation: "Coerção numérica." },
      { text: "Boolean(0) retorna?", options: ["true","false","null","undefined"], answer: 1, explanation: "0 é falsy." },
      { text: "Operador que retorna direita se esquerda for null/undefined?", options: ["||","??","&&","!"], answer: 1, explanation: "?? é coalescência nula." },
      { text: "typeof function(){} retorna?", options: ["object","function","method","callable"], answer: 1, explanation: "Funções retornam 'function'." }
    ];

    let respostasCorretas = Array(questions.length).fill(false);
    const quizContainer = document.getElementById("quiz");

    questions.forEach((q, idx) => {
      const card = document.createElement("div");
      card.className = "card mb-3";
      card.innerHTML = `
        <div class="card-body">
          <h5 class="card-title">Questão ${idx + 1}</h5>
          <p>${q.text}</p>
          ${q.options.map((opt, i) => `
            <div class="form-check">
              <input class="form-check-input" type="radio" name="q${idx}" value="${i}">
              <label class="form-check-label">${opt}</label>
            </div>`).join('')}
          <button class="btn btn-primary btn-sm mt-2">Ver Explicação</button>
          <div class="feedback mt-2 fw-bold"></div>
          <div class="explanation text-muted fst-italic" style="display:none;">${q.explanation}</div>
        </div>
      `;
      const btn = card.querySelector("button");
      btn.onclick = () => {
        const selected = card.querySelector(`input[name="q${idx}"]:checked`);
        const feedback = card.querySelector(".feedback");
        const explanation = card.querySelector(".explanation");
        if (!selected) {
          feedback.textContent = "⚠️ Selecione uma opção.";
          feedback.classList.add("text-danger");
          explanation.style.display = "none";
          return;
        }
        if (parseInt(selected.value) === q.answer) {
          feedback.textContent = "✅ Correto!";
          feedback.classList.remove("text-danger");
          feedback.classList.add("text-success");
          respostasCorretas[idx] = true;
        } else {
          feedback.textContent = "❌ Incorreto.";
          feedback.classList.remove("text-success");
          feedback.classList.add("text-danger");
          respostasCorretas[idx] = false;
        }
        explanation.style.display = "block";
      };
      quizContainer.appendChild(card);
    });

    function finalizarQuiz() {
      const total = respostasCorretas.filter(Boolean).length;
      document.getElementById("final-result").innerHTML = `
        <div class="alert alert-info">
          Você acertou ${total} de ${questions.length} questões.
        </div>
      `;
    }
  </script>
</body>
</html>
