<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz de Lógica em JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #333;
    }
    .question {
      background: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .question h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .options label {
      display: block;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .feedback {
      margin-top: 10px;
      font-weight: bold;
    }
    .correct {
      color: green;
    }
    .incorrect {
      color: red;
    }
    .explanation {
      margin-top: 5px;
      font-style: italic;
      color: #555;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #final-result {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Quiz de Lógica de Programação em JavaScript</h1>
  <p>Responda as questões abaixo e clique em "Ver Explicação" para saber se acertou. Ao final, clique em "Finalizar Quiz" para ver seu desempenho.</p>

  <div id="quiz"></div>
  <button onclick="finalizarQuiz()">Finalizar Quiz</button>
  <div id="final-result"></div>

  <script>
    const questions = [
      {
        text: "Qual é o principal objetivo da lógica de programação em JavaScript no desenvolvimento frontend?",
        options: ["Gerenciar bancos de dados diretamente", "Criar estilos visuais para páginas web", "Definir a estrutura HTML da página", "Manipular dados e controlar o fluxo de execução"],
        answer: 3,
        explanation: "A lógica de programação em JavaScript é usada para manipular dados, controlar o fluxo de execução (como decisões e repetições) e interagir com elementos da interface."
      },
      {
        text: "Qual estrutura de controle é usada para executar um bloco de código repetidamente enquanto uma condição for verdadeira?",
        options: ["while", "switch", "if", "try"],
        answer: 0,
        explanation: "A estrutura 'while' permite repetir um bloco de código enquanto a condição especificada for verdadeira."
      },
      {
        text: "Em JavaScript, qual tipo de dado é usado para armazenar uma sequência de caracteres?",
        options: ["String", "Number", "Array", "Boolean"],
        answer: 0,
        explanation: "O tipo 'String' é utilizado para armazenar textos, ou seja, sequências de caracteres."
      },
      {
        text: "Qual operador é usado para comparar valores e tipos em JavaScript?",
        options: ["===", "=", "==", "!="],
        answer: 0,
        explanation: "O operador '===' compara tanto o valor quanto o tipo dos operandos, garantindo uma comparação mais precisa."
      },
      {
        text: "O que é uma função em JavaScript?",
        options: ["Uma estrutura condicional", "Um bloco de código reutilizável que realiza uma tarefa específica", "Um operador lógico", "Um tipo de dado que armazena múltiplos valores"],
        answer: 1,
        explanation: "Funções são blocos de código que podem ser definidos uma vez e executados várias vezes."
      }
    ];

    let respostasCorretas = new Array(questions.length).fill(false);

    const quizContainer = document.getElementById("quiz");

    questions.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";

      const title = document.createElement("h2");
      title.textContent = `Questão ${index + 1}: ${q.text}`;
      div.appendChild(title);

      const optionsDiv = document.createElement("div");
      optionsDiv.className = "options";

      q.options.forEach((opt, i) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q${index}`;
        input.value = i;
        label.appendChild(input);
        label.appendChild(document.createTextNode(` ${opt}`));
        optionsDiv.appendChild(label);
      });

      div.appendChild(optionsDiv);

      const btn = document.createElement("button");
      btn.textContent = "Ver Explicação";
      btn.onclick = () => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const feedback = div.querySelector(".feedback");
        const explanation = div.querySelector(".explanation");

        if (!selected) {
          feedback.textContent = "⚠️ Por favor, selecione uma opção.";
          feedback.className = "feedback incorrect";
          explanation.style.display = "none";
          return;
        }

        const selectedValue = parseInt(selected.value);
        if (selectedValue === q.answer) {
          feedback.textContent = "✅ Correto!";
          feedback.className = "feedback correct";
          respostasCorretas[index] = true;
        } else {
          feedback.textContent = "❌ Incorreto.";
          feedback.className = "feedback incorrect";
          respostasCorretas[index] = false;
        }

        explanation.style.display = "block";
      };
      div.appendChild(btn);

      const feedback = document.createElement("div");
      feedback.className = "feedback";
      div.appendChild(feedback);

      const explanation = document.createElement("div");
      explanation.className = "explanation";
      explanation.style.display = "none";
      explanation.textContent = `💡 Explicação: ${q.explanation}`;
      div.appendChild(explanation);

      quizContainer.appendChild(div);
    });

    function finalizarQuiz() {
      const total = questions.length;
      const acertos = respostasCorretas.filter(Boolean).length;
      const resultado = document.getElementById("final-result");

      let mensagem = "";
      if (acertos === total) {
        mensagem = "🎉 Parabéns! Você acertou todas as questões!";
      } else if (acertos >= total * 0.7) {
        mensagem = "👏 Muito bem! Continue praticando para alcançar a perfeição.";
      } else {
        mensagem = "💡 Continue estudando! A prática leva à maestria.";
      }

      resultado.innerHTML = `
        <h2>Resultado Final</h2>
        <p>Você acertou <strong>${acertos}</strong> de <strong>${total}</strong> questões.</p>
        <p>${mensagem}</p>
      `;
    }
  </script>
</body>
</html>
